{% extends 'base.html' %}

{% block content %}
    <h2>Удаление книги</h2>

    <p>
        Вы действительно хотите удалить книгу
        <strong>«{{ book.title }}»</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button class="btn btn-danger" type="submit">Да, удалить</button>
        <a class="btn" href="{% url 'book_detail' book.pk %}">Отмена</a>
    </form>
{% endblock %}
