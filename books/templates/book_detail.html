{% extends 'base.html' %}

{% block content %}
    <h2>{{ book.title }}</h2>

    <p><strong>Автор:</strong> {{ book.author }}</p>
    <p><strong>Жанр:</strong> {{ book.genre }}</p>
    <p><strong>Год издания:</strong> {{ book.year }}</p>

    <h3>Описание</h3>
    <p>{{ book.description }}</p>

    <p><strong>Дата добавления:</strong> {{ book.created_at }}</p>

    <a class="btn" href="{% url 'book_list' %}">Назад к списку</a>
    <a class="btn" href="{% url 'book_update' book.pk %}">Редактировать</a>
    <a class="btn btn-danger" href="{% url 'book_delete' book.pk %}">Удалить</a>
{% endblock %}
